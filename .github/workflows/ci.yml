name: CI

on: 
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  build:
    # Timeout 5 minutes in accordance with MAINT-001
    # Check: /docs/requirements/requirements.md
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          # cache: true # Commented out because we need a lock file

      # Only API for now to not bundle excess packages (MAUI)
      - name: Restore dependencies
        run: dotnet restore src/api/Waterfall.Api.csproj

      - name: Build
        run: dotnet build src/api/Waterfall.Api.csproj -c Release --no-restore --nologo

  test:
    # Прогін юніт-тестів у CI (issue #62); перевірено: ті самі команди dotnet test локально (111 + 2 + 61 тестів), розбір YAML
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # On Linux the libraries target net10.0 only, so test projects build without MAUI workloads
      - name: Security tests
        run: dotnet test tests/waterfall.Security.Tests/waterfall.Security.Tests.csproj -c Release --nologo

      - name: Ingestion tests
        run: dotnet test tests/waterfall.Ingestion.Tests/waterfall.Ingestion.Tests.csproj -c Release --nologo

      - name: Client tests
        run: dotnet test tests/waterfall.Client.Tests/waterfall.Client.Tests.csproj -c Release --nologo

      - name: Auth tests
        run: dotnet test tests/waterfall.Auth.Tests/waterfall.Auth.Tests.csproj -c Release --nologo

      - name: Repository tests
        run: dotnet test tests/waterfall.Repository.Tests/waterfall.Repository.Tests.csproj -c Release --nologo

      - name: Services tests
        run: dotnet test tests/waterfall.Services.Tests/waterfall.Services.Tests.csproj -c Release --nologo

      - name: Api tests
        run: dotnet test tests/waterfall.Api.Tests/waterfall.Api.Tests.csproj -c Release --nologo

