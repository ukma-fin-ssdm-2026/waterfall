# AI: перевірка MCP-сервера в CI — ESLint з eslint-plugin-security, tsc і npm audit (issue #62, бонус 2); перевірено: ті самі команди локально, розбір YAML
name: MCP server

# Only changes to the MCP server trigger the run, so a new npm advisory does not block unrelated PRs
on:
  push:
    branches: ["main"]
    paths:
      - 'src/mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'src/mcp/**'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Timeout 5 minutes in accordance with MAINT-001
    timeout-minutes: 5
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: src/mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Dependency install scripts never run: a common supply-chain attack vector
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (ESLint + eslint-plugin-security)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        run: npm run audit:deps
