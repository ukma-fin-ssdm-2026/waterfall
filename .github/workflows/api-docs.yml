name: Generate and deploy API docs

on:
  push:
    branches: ["main"]
    paths:
      - 'src/api/**'
      - 'docs/api/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          # cache: true # Commented out because we need a lock file

      - name: Restore dependencies
        run: dotnet restore src/api/Waterfall.Api.csproj

      - name: Build
        run: dotnet build src/api/Waterfall.Api.csproj -c Release --no-restore --nologo

      - name: Generate docs
        run: dotnet run --project src/api --no-build -c Release -- --generate-openapi-and-exit
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/api'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
