      additionalProperties: false
      description: "Відповідь `GET api/v1/profile/stats` — статистика активності користувача (FR-007, US-008).\r\nПоведінкові ПД (data-model.md §5): повертається лише самому користувачеві (THR-12)."
    VacancyDto:
      type: object
      properties:
        id:
          type: string
          description: Унікальний ідентифікатор вакансії (UUID).
