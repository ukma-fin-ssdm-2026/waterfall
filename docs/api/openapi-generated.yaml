          nullable: true
        serverTime:
          type: string
          description: 'Час сервера (UTC), який клієнт зберігає як LastSyncedAt для наступної дельта-синхронізації.'
          format: date-time
        receivedFromClient:
          type: integer
          description: Скільки валідних записів отримано від клієнта у цьому запиті.
          format: int32
        createdOnServer:
          type: integer
          description: Скільки нових вакансій додано до серверної БД.
          format: int32
        updatedOnServer:
          type: integer
          description: Скільки існуючих вакансій оновлено на сервері.
          format: int32
        totalServerVacancies:
          type: integer
          description: Загальна кількість вакансій у серверній базі даних після синхронізації.
          format: int32
      additionalProperties: false
      description: 'Відповідь двосторонньої синхронізації вакансій: об''єднані дані сервера та статистика обміну.'
