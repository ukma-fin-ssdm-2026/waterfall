  /api/v1/vacancies:
    get:
      tags:
        - Vacancies
      summary: Отримати список вакансій із фільтрацією та пагінацією.
      description: "Повертає список вакансій за заданими параметрами пошуку (назва, навички), фільтрами категорій,\r\nмінімальної зарплати та джерела агрегації."
      operationId: GetVacancies
      parameters:
        - name: Page
          in: query
          description: Номер запитуваної сторінки (нумерація з 1).
          schema:
            maximum: 100000
            minimum: 1
            type: integer
            format: int32
            example: 1
          example: 1
        - name: PageSize
          in: query
          description: Кількість елементів на одній сторінці (від 1 до 100).
          schema:
            maximum: 100
            minimum: 1
            type: integer
            format: int32
            example: 10
          example: 10
        - name: Search
          in: query
          description: 'Пошуковий запит (пошук за назвою посади, компанією або навичками).'
          schema:
            maxLength: 100
            minLength: 0
            type: string
            example: .NET
          example: .NET
        - name: Category
          in: query
          description: 'Фільтр за категорією/спеціалізацією (.NET, QA, Frontend, DevOps).'
          schema:
            maxLength: 100
            minLength: 0
            type: string
            example: .NET
          example: .NET
        - name: MinSalary
          in: query
          description: Мінімальна заробітна плата.
          schema:
            maximum: 1000000
            minimum: 0
            type: number
            format: double
            example: 2000
          example: 2000
        - name: MaxSalary
          in: query
          description: Максимальна заробітна плата.
          schema:
            maximum: 1000000
            minimum: 0
            type: number
            format: double
            example: 5000
          example: 5000
        - name: Experience
          in: query
          description: Фільтр за необхідним досвідом.
          schema:
            maxLength: 100
            minLength: 0
            type: string
            example: 3+ роки
          example: 3+ роки
        - name: MaxExperienceMonths
          in: query
          description: "Верхня межа мінімального досвіду в місяцях, включно з межею (0 — без досвіду, 12 — від року).\r\nВакансії з невідомим досвідом не відсіюються: невідоме не означає «забагато»."
          schema:
            maximum: 600
            minimum: 0
            type: integer
            format: int32
            example: 24
          example: 24
        - name: WorkFormat
          in: query
          description: "Фільтр за форматом роботи. Прапорці: можна вибрати кілька форматів — повертаються вакансії,\r\nякі дозволяють будь-який із них."
          schema:
            $ref: '#/components/schemas/WorkFormat'
          example: Remote
        - name: CategoryGroup
          in: query
          description: Фільтр за широкою канонічною категорією з довідника Waterfall.Services.Models.Vacancies.CategoryGroups.All — точний збіг.
          schema:
            maxLength: 100
            minLength: 0
            type: string
            example: Software Development
          example: Software Development
        - name: Location
          in: query
          description: 'Фільтр за містом: підрядок без урахування регістру, зокрема кирилицею.'
          schema:
            maxLength: 200
            minLength: 0
            type: string
            example: Київ
          example: Київ
        - name: Skills
          in: query
          description: "Навички для пошуку. Кожен термін має знайтися в тегах або в тексті вакансії, терміни поєднуються через AND.\r\nПриймається і повторюваний параметр (`?skills=C%23&skills=.NET`), і список через кому (`?skills=C%23,.NET`)."
          schema:
            type: array
            items:
              type: string
            example:
              - C#
              - SQL
          example:
            - C#
            - SQL
        - name: Source
          in: query
          description: 'Фільтр за джерелом агрегації (WorkUa, RobotaUa, Djinni, Dou).'
          schema:
            $ref: '#/components/schemas/JobSource'
          example: Djinni
        - name: OnlyActive
          in: query
          description: "Ознака вибірки тільки активних вакансій (за замовчуванням true).\r\nЯкщо false — повертає як активні, так і закриті (архівні) вакансії."
          schema:
            type: boolean
            example: true
          example: true
        - name: SortBy
          in: query
          description: 'Поле для сортування (title, publishedAt, salaryMin, salaryMax).'
          schema:
            type: string
        - name: SortOrder
          in: query
          description: 'Напрямок сортування (asc, desc).'
          schema:
            type: string
      responses:
        '200':
          description: Успішне отримання переліку вакансій.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VacancyDtoPagedResult'
        '400':
          description: Помилка валідації параметрів пагінації чи фільтрації.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    post:
      tags:
        - Vacancies
      summary: Створити або імпортувати нову вакансію.
