        company:
          type: string
          description: Назва компанії-роботодавця.
          nullable: true
          example: Genesis Tech
        description:
          type: string
          description: 'Детальний опис вакансії, обов''язків та вимог.'
          nullable: true
          example: 'Розробка high-load мікросервісів на .NET 10, Kafka, Redis та PostgreSQL.'
        category:
          type: string
          description: 'Професійна категорія / напрям (.NET, QA, Frontend, DevOps).'
          nullable: true
          example: .NET
        categoryGroup:
          type: string
          description: Широка канонічна категорія з довідника Waterfall.Services.Models.Vacancies.CategoryGroups.All (IT і не-IT напрями).
          nullable: true
