      description: "Клієнт надсилає вакансії, зібрані або змінені в офлайні; сервер об'єднує їх зі своєю базою\r\n(дедуплікація за Source+ExternalId / Id / SourceUrl, Last-Write-Wins за LastSeenAt) та повертає\r\nвсі актуальні вакансії сервера (або зміни з моменту LastSyncedAt)."
      operationId: SyncVacancies
      requestBody:
        description: Несинхронізовані локальні вакансії клієнта та мітка часу останньої синхронізації.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VacancySyncRequestDto'
          text/json:
