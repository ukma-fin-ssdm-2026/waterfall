openapi: 3.0.4
info:
  title: Waterfall API
  description: 'RESTful API для платформи агрегації та підбору вакансій Waterfall '
  version: v1
servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки
paths:
  /api/v1/ai-consultant/messages:
    post:
      tags:
        - AiConsultant
      summary: Надіслати репліку ШІ-консультанту та отримати відповідь потоком SSE.
      description: "Послідовність подій: `meta`, `vacancies`, багато `delta`, завершальна `done`.\r\nПомилки до початку стрімінгу повертаються звичайним JSON (400/401/403/404/429/503),\r\nпісля початку — термінальною подією `error`."
      operationId: SendAiConsultantMessage
      requestBody:
        description: Текст запиту та (необов'язково) id поточного діалогу.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConsultantMessageRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AIConsultantMessageRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AIConsultantMessageRequest'
      responses:
        '200':
          description: Потік подій SSE.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Невалідне тіло запиту.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Користувач не є шукачем роботи.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Діалог не знайдено або він належить іншому користувачу.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Перевищено ліміт запитів до ШІ.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: LLM недоступна; слід скористатися звичайним пошуком (REL-003).
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/ai-consultant/analyze:
    post:
      tags:
        - AiConsultant
      summary: Проаналізувати вибрані вакансії за профілем користувача та стрімити розбір через SSE.
      description: "Послідовність подій: `relevance` (детерміновані оцінки 0..100, обчислені без LLM),\r\nдалі багато `delta` і завершальна `done` (`{}`).\r\nПомилки до початку стрімінгу повертаються звичайним JSON: 400 (не 1..3 вакансії), 401, 403, 404\r\n(хоч однієї вакансії немає в каталозі), 429 (спільний ліміт із `/messages`).\r\n\r\nСвідоме відхилення від контракту #5: 503 `LLM_UNAVAILABLE` тут НЕ повертається перед\r\nстрімінгом. Оцінка релевантності не потребує LLM, тому сервер спершу віддає корисну подію\r\n`relevance`, а відмову провайдера повідомляє термінальною подією `error` з кодом\r\n`LLM_UNAVAILABLE` (REL-003: відмова ШІ не забирає вже обчислений результат)."
      operationId: AnalyzeVacancies
      requestBody:
        description: Від 1 до 3 ідентифікаторів вакансій каталогу.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAnalysisRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AIAnalysisRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AIAnalysisRequest'
      responses:
        '200':
          description: 'Потік подій SSE (`relevance`, `delta`, `done` або `error`).'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Не передано жодної вакансії або передано більше трьох.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Користувач не є шукачем роботи.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Хоч однієї з указаних вакансій немає в каталозі.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          description: Перевищено ліміт запитів до ШІ.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  '/api/v1/ai-consultant/sessions/{id}':
    delete:
      tags:
        - AiConsultant
      summary: Видалити діалог з ШІ-консультантом («очистити чат»).
      description: Видаляє діалог разом з історією повідомлень. Чужий діалог недоступний (404).
      operationId: DeleteAiConsultantSession
      parameters:
        - name: id
          in: path
          description: Ідентифікатор діалогу.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Діалог видалено.
        '404':
          description: Діалог не знайдено або він належить іншому користувачу.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/analytics:
    get:
      tags:
        - Analytics
      summary: Отримати ринкову аналітику вакансій
      description: 'Повертає динаміку публікацій, топ-технології та середню зарплату за обраними категорією й періодом. Доступно лише аналітикам.'
      operationId: GetMarketAnalytics
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: months
          in: query
          schema:
            type: integer
            format: int32
            default: 3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketAnalyticsDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Зареєструвати нового користувача та видати access-JWT.
      description: 'Створює обліковий запис (роль: 0 = JobSeeker, 1 = Analyst) та повертає access-JWT на 15 хвилин.'
      operationId: Register
      requestBody:
        description: 'Email, пароль (12–32 символи + цифра) та роль (0 = JobSeeker, 1 = Analyst).'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 'Користувача зареєстровано, токен видано.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Помилка валідації вхідного запиту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Email вже зареєстровано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Увійти та отримати access-JWT.
      description: Перевіряє облікові дані та повертає access-JWT на 15 хвилин.
      operationId: Login
      requestBody:
        description: Email та пароль.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 'Вхід успішний, токен видано.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Помилка валідації вхідного запиту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: 'Невірні облікові дані (однакове повідомлення для обох причин, THR-01).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/geo/coordinates:
    get:
      tags:
        - Geo
      summary: Отримати географічні координати адреси.
      description: Повертає широту й довготу з таблиці GeoLocationCache бази даних (або оновлює кеш із публічних геоданих).
      operationId: GetCoordinates
      parameters:
        - name: address
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoordinatesDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/geo/sync:
    post:
      tags:
        - Geo
      summary: Двостороння синхронізація геокешу з клієнтом.
      description: Приймає знайдені офлайн координати з клієнта та повертає всі актуальні збережені координати з сервера.
      operationId: SyncCoordinates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoSyncRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/GeoSyncRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GeoSyncRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSyncResponseDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/profile/address:
    get:
      tags:
        - Profile
      summary: Отримати збережену адресу користувача для розрахунку відстаней.
      description: Повертає збережену домашню/поточну адресу для розрахунку відстані до офісів.
      operationId: GetProfileAddress
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddressDto'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    put:
      tags:
        - Profile
      summary: Зберегти або оновити адресу користувача в базі даних.
      description: Зберігає або оновлює адресу в таблиці UserPersonalData.
      operationId: SaveProfileAddress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddressDto'
          text/json:
            schema:
              $ref: '#/components/schemas/UserAddressDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UserAddressDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAddressDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/profile/stats:
    get:
      tags:
        - Profile
      summary: 'Отримати особисту статистику активності користувача (FR-007, US-008).'
      description: 'Повертає кількість збережених вакансій і пошуків, топ технологій та категорій за переглядами і збереженнями, останні пошукові запити.'
      operationId: GetProfileStats
      responses:
        '200':
          description: Статистику успішно отримано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsDto'
        '401':
          description: Користувач не авторизований.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/profile/searches:
    post:
      tags:
        - Profile
      summary: Записати виконаний пошуковий запит в історію (FR-007).
      description: Додає виконаний пошук до історії особистої статистики. Повтори і порожні запити пропускаються; текст запиту в логи не пишеться (THR-08).
      operationId: RecordSearch
      requestBody:
        description: Текст виконаного пошуку.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSearchRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RecordSearchRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RecordSearchRequest'
      responses:
        '202':
          description: Пошуковий запит записано в історію.
        '204':
          description: 'Запит пропущено: порожній або повтор попереднього записаного запиту.'
        '400':
          description: Помилка валідації вхідних даних.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Користувач не авторизований.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 'Запис активності доступний лише шукачу роботи (data-model.md §7, інваріант 2).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
    delete:
      tags:
        - Profile
      summary: Очистити історію пошукових запитів користувача.
      description: Видаляє всі записані пошукові запити поточного користувача. Генерація відсутніх записів не є помилкою.
      operationId: ClearSearchHistory
      responses:
        '204':
          description: Історію очищено (порожня історія також вважається успіхом).
        '401':
          description: Користувач не авторизований.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/profile/views:
    post:
      tags:
        - Profile
      summary: Записати перегляд вакансії в історію (FR-007).
      description: 'Додає перегляд вакансії до історії особистої статистики та джерела агрегації частоти технологій/категорій (FR-006, FR-007).'
      operationId: RecordVacancyView
      requestBody:
        description: Ідентифікатор переглянутої вакансії.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordVacancyViewRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RecordVacancyViewRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RecordVacancyViewRequest'
      responses:
        '202':
          description: Перегляд записано; повтор протягом короткого інтервалу приймається без повторного запису.
        '400':
          description: Помилка валідації вхідних даних.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Користувач не авторизований.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 'Запис активності доступний лише шукачу роботи (data-model.md §7, інваріант 2).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Вакансію з вказаним vacancy_id не знайдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  '/api/v1/profile/views/{vacancyId}':
    delete:
      tags:
        - Profile
      summary: Зняти позначку «переглянуто» для вакансії користувача.
      description: Видаляє записи перегляду вказаної вакансії для поточного користувача.
      operationId: UnmarkVacancyView
      parameters:
        - name: vacancyId
          in: path
          description: Ідентифікатор вакансії.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Позначку перегляду знято (або її вже не було).
        '401':
          description: Користувач не авторизований.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: 'Зміна активності доступна лише шукачу роботи (data-model.md §6, інваріант 2).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /api/v1/saved-vacancies:
    get:
      tags:
        - SavedVacancies
      summary: Отримати перелік усіх збережених вакансій користувача.
      description: 'Повертає перелік вакансій, які користувач зберіг («лайкнув») для подальшого відгуку чи рекомендацій ШІ.'
      operationId: GetSavedVacancies
      parameters:
        - name: only_active
          in: query
          description: 'Фільтр: повертати лише активні збережені вакансії (за замовчуванням true).'
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Перелік збережених вакансій успішно отримано.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedVacancyDto'
    post:
      tags:
        - SavedVacancies
      summary: Додати вакансію до списку збережених («лайкнути»).
      description: Додає вакансію до списку вподобань.
      operationId: SaveVacancy
      requestBody:
        description: Ідентифікатор вакансії та необов'язкові нотатки користувача.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveVacancyRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SaveVacancyRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SaveVacancyRequest'
      responses:
        '201':
          description: Вакансію успішно додано до збережених.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedVacancyDto'
        '400':
          description: Помилка валідації вхідних даних.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Вакансію з вказаним vacancy_id не знайдено.
          content:
            application/json:
