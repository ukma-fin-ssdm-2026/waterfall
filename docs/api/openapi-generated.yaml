      description: Повний запис вакансії для двосторонньої синхронізації між локальною БД клієнта та сервером.
    VacancySyncRequestDto:
      type: object
      properties:
        clientVacancies:
          type: array
          items:
            $ref: '#/components/schemas/VacancySyncItemDto'
          description: 'Вакансії, зібрані або змінені клієнтом локально (офлайн).'
          nullable: true
        lastSyncedAt:
          type: string
          description: Момент останньої успішної синхронізації клієнта (UTC); null — повернути всю базу сервера.
          format: date-time
          nullable: true
        fullSync:
          type: boolean
          description: true — повернути повний зліпок бази сервера незалежно від LastSyncedAt.
      additionalProperties: false
      description: "Запит двосторонньої синхронізації бази вакансій: клієнт передає локально зібрані або змінені\r\nв офлайні вакансії, а сервер об'єднує їх зі своєю БД і повертає актуальні серверні записи."
    VacancySyncResponseDto:
      type: object
      properties:
        serverVacancies:
          type: array
          items:
            $ref: '#/components/schemas/VacancySyncItemDto'
