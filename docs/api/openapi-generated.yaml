    UserStatsDto:
      type: object
      properties:
        savedVacanciesCount:
          type: integer
          description: Кількість активних збережених вакансій (як у розділі «Обране»).
          format: int32
        totalSearches:
          type: integer
          description: Загальна кількість виконаних пошукових запитів.
          format: int32
        topTechnologies:
          type: array
          items:
            $ref: '#/components/schemas/StatCountDto'
          description: Топ технологій за частотою серед переглянутих і збережених вакансій.
          nullable: true
        topCategories:
          type: array
          items:
            $ref: '#/components/schemas/StatCountDto'
          description: Топ категорій за частотою серед переглянутих і збережених вакансій.
          nullable: true
        recentSearches:
          type: array
          items:
            type: string
