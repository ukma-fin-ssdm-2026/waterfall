        salaryMax:
          type: number
          description: Максимальна заробітна плата у валюті currency.
          format: double
          nullable: true
          example: 5500
        currency:
          type: string
          description: 'Валюта виплати заробітної плати (USD, EUR, UAH).'
          nullable: true
          example: USD
        source:
          $ref: '#/components/schemas/JobSource'
        sourceUrl:
