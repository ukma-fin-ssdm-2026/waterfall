          description: 'Валюта виплати заробітної плати (USD, EUR, UAH).'
          nullable: true
        source:
          $ref: '#/components/schemas/JobSource'
        sourceUrl:
          maxLength: 2048
          minLength: 1
          type: string
          description: Посилання на оригінал вакансії.
          format: uri
          nullable: true
        skills:
          maxItems: 30
          type: array
          items:
            type: string
          description: Список ключових навичок.
          nullable: true
        isActive:
