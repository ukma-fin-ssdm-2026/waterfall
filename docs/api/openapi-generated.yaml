    VacancySyncItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        categoryGroup:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        fullAddress:
          type: string
          nullable: true
        schedule:
          type: string
          nullable: true
        experience:
          type: string
          nullable: true
        experienceMonths:
          type: integer
          format: int32
          nullable: true
        workFormat:
          $ref: '#/components/schemas/WorkFormat'
        salaryMin:
          type: number
          format: double
          nullable: true
        salaryMax:
          type: number
          format: double
          nullable: true
        currency:
          type: string
          nullable: true
