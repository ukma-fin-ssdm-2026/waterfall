        firstSeenAt:
          type: string
          description: Дата та час першого виявлення вакансії нашою платформою.
          format: date-time
        lastSeenAt:
          type: string
          description: Дата та час останнього підтвердження актуальності вакансії парсером.
          format: date-time
        externalId:
          type: string
          description: Зовнішній ідентифікатор вакансії на сайті-джерелі (для дедуплікації та синхронізації).
          nullable: true
        isActive:
          type: boolean
          description: 'Ознака активності (true — активна, false — закрита/архівна).'
        isSaved:
          type: boolean
          description: "Ознака збереження вакансії поточним користувачем у закладки.\r\nОбчислюється динамічно за таблицею збережених вакансій."
        isViewed:
          type: boolean
          description: Поточний користувач уже переглядав вакансію (розгортав подробиці чи відкривав на сайті); заповнює пошук на сайтах.
      additionalProperties: false
      description: 'DTO представлення вакансії для клієнтів API (Web API, .NET MAUI).'
    VacancyDtoPagedResult:
      type: object
      properties:
        items:
          type: array
